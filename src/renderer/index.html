<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; frame-src 'self' file:; media-src 'self' blob:; connect-src 'self' file: blob: data:">
<title>Jarvis</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titlebar"></div>
  <div id="layout">
    <aside id="sidebar">
      <div class="side-head">
        <span class="brand"><span class="rec-dot" id="recDot"></span>Jarvis</span>
        <button id="btnNewDoc" title="새 문서 (질문/주제)">＋</button>
      </div>
      <div id="docList"></div>
      <div class="side-foot">
        <div class="proj" id="projRow" title="클릭해서 프로젝트 폴더 변경">
          <span class="proj-label">PROJECT</span>
          <span id="projPath">—</span>
        </div>
        <label class="spk-row"><input type="checkbox" id="chkWake"> 🎙 "자비스" 호출 대기</label>
        <label class="spk-row"><input type="checkbox" id="chkGesture"> ✊ 주먹 제스처 대기 (카메라)</label>
        <div id="gestureStatus" class="stt-status"></div>
        <div id="wakeStatus" class="stt-status"></div>
        <div id="sttStatus" class="stt-status"></div>
      </div>
    </aside>

    <main id="main">
      <div id="docBar" hidden>
        <button id="btnMap" title="프로젝트 맵 — 전체 프로젝트·갈래 연결을 한눈에">☰</button>
        <button id="docProj" title="이 문서와 연결된 프로젝트 폴더 — 클릭해 변경"></button>
        <button id="docProjClear" title="연결 해제 — 전역 기본 프로젝트 사용" hidden>✕</button>
        <button id="docConvert" title="레거시 HTML 문서를 마크다운으로 변환 — 블록 편집 가능해집니다" hidden>⇄ md로 변환</button>
      </div>
      <div id="gestureToast" hidden></div>
      <div id="docFrameWrap">
        <div id="emptyState">
          <p class="empty-title">문서를 선택하거나 ＋ 로 새 주제를 시작하세요</p>
          <p class="empty-sub">질문을 던지면 HTML 문서가 생성되고, 음성·텍스트 피드백으로 계속 보강됩니다.<br>
          소스코드 작업을 시키면 선택한 프로젝트에서 실제로 수행합니다.</p>
        </div>
        <iframe id="docFrame" hidden></iframe>
        <div id="mdView" hidden></div>
        <div id="mapView" hidden>
          <div id="mapHead">
            <span class="proc-title">프로젝트 맵 — 진행 중인 전체 문서</span>
            <button id="mapClose" title="닫기 (ESC)">✕</button>
          </div>
          <div id="mapBody"></div>
        </div>
      </div>

      <div id="procWrap" hidden>
        <div id="procHead">
          <span class="proc-title">작업 과정</span>
          <button id="procToggle" title="접기/펼치기">▾</button>
        </div>
        <div id="procLog"></div>
      </div>

      <div id="activity" hidden>
        <span class="spinner"></span><span id="activityText">작업 중…</span>
      </div>

      <div id="composer">
        <button id="btnMic" title="말하기 (누르면 녹음 시작, 침묵 시 자동 종료)">🎙</button>
        <textarea id="input" rows="1" placeholder="피드백을 입력하거나 🎙 로 말하세요…  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
        <button id="btnSend" title="전송">↑</button>
      </div>
      <div id="lastReply" hidden></div>
    </main>
  </div>

  <!-- 새 문서 모달 -->
  <div id="modal" hidden>
    <div class="modal-card">
      <p class="modal-title">새 주제 / 질문</p>
      <input id="modalInput" placeholder="예: 급등주 스캔 조건 개선 아이디어">
      <div class="modal-actions">
        <button id="modalCancel">취소</button>
        <button id="modalOk" class="primary">문서 만들기</button>
      </div>
    </div>
  </div>

  <video id="gestureCam" autoplay playsinline muted style="display:none"></video>
  <script src="app.js"></script>
</body>
</html>
